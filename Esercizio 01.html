<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizzazione Riquadro WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        #track {
            position: relative;
            width: 80%;
            height: 100px;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        #box {
            position: absolute;
            top: 10px;
            left: 0%;
            width: 10%;
            height: 80px;
            background-color: #ff4d4d;
            border-radius: 6px;
            transition: left 0.016s linear; /* Rende il movimento fluido */
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Movimento pilotato dal server</h2>
    <div id="track">
        <div id="box"></div>
    </div>
    <div id="status">Connessione in corso...</div>

    <script>
        const box = document.getElementById('box');
        const statusDiv = document.getElementById('status');

        
        const socket = new WebSocket('ws://localhost:8080');

        socket.onopen = () => {
            statusDiv.textContent = 'Stato: Connesso al server';
            statusDiv.style.color = 'green';
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'position') {
                // Aggiorna la posizione del riquadro rosso
                box.style.left = data.x + '%';
            }
        };

        socket.onclose = () => {
            statusDiv.textContent = 'Stato: Disconnesso';
            statusDiv.style.color = 'red';
        };

        socket.onerror = (error) => {
            console.error('Errore WebSocket:', error);
        };
    </script>
</body>
</html>
